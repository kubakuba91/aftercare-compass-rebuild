name: Sync Resources playlist (pending review)

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (9 AM ET in summer)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: michael-grok-bot-testing # never main
      SYNC_BRANCH: bot/resources-playlist-sync
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }} # optional; RSS used if empty
        run: node scripts/sync-resource-playlist.mjs
      - name: Open review PR if pending changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- content/resources/pending-videos.json && [ -z "$(git ls-files --others --exclude-standard content/resources)" ]; then
            echo "No new playlist videos."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add content/resources/pending-videos.json
          git commit -m "Resources: pending playlist videos for review"
          git push -f origin "$SYNC_BRANCH"
          gh pr view "$SYNC_BRANCH" >/dev/null 2>&1 || gh pr create --base "$BASE_BRANCH" --head "$SYNC_BRANCH" \
            --title "Resources: new playlist videos pending review" \
            --body "Auto-generated by the weekly playlist sync. Review draft summaries in content/resources/pending-videos.json, then promote approved videos into lib/resource-videos.ts. Do not auto-merge."
